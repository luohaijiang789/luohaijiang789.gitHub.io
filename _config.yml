# Site Configuration
theme: jekyll-theme-chirpy

lang: zh-CN
timezone: Asia/Shanghai

title: luohaijiang · AI 前沿观察
tagline: 大模型 · 智能体 · AI 工具 · 行业动态
description: >-
  luohaijiang 的个人 AI 技术博客。追踪大模型、智能体、AI 工具与行业动态，
  每日精选人工智能前沿资讯与深度洞察。

url: "https://luohaijiang789.github.io"

github:
  username: luohaijiang789

social:
  name: luohaijiang
  links:
    - https://github.com/luohaijiang789

theme_mode: light

avatar: https://tse4-mm.cn.bing.net/th/id/OIP-C.jLr5MvRlf7oFAF_tp1blOQHaHa

toc: true

pwa:
  enabled: true
  cache:
    enabled: true

paginate: 10
baseurl: ""

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
