<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">英语场景：团队晨会中讨论智能体权限告警</title><desc id="desc">Maya 问发生了什么，海江解释智能体试图读取私密文件，权限层已经拦截。桌上的流程图显示智能体、权限检查和私密文件。</desc>
