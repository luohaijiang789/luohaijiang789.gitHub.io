<rect x="437" y="71" width="457" height="122" rx="18" fill="#e0ecdd" stroke="#a8c2a5"/><path d="m745 193 16 23 7-23" fill="#e0ecdd" stroke="#a8c2a5"/><text x="459" y="108" font-size="18" fill="#2d4435">It tried to read a private file.</text><text x="459" y="138" font-size="18" fill="#2d4435">The policy gate blocked the request.</text><text x="459" y="170" font-size="15" fill="#677466">Haijiang · 说明观察到的事实</text>
